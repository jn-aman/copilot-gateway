services:
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/jn-aman/copilot-gateway:latest}
    env_file:
      - ${GATEWAY_ENV_FILE:-.env}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PUBLISHED_PORT:-4141}:${PORT:-4141}"
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-4141}
      ACCOUNT_TYPE: ${ACCOUNT_TYPE:-individual}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-300000}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      MIN_REQUEST_INTERVAL_MS: ${MIN_REQUEST_INTERVAL_MS:-0}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-4194304}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      MAX_RETRY_DELAY_MS: ${MAX_RETRY_DELAY_MS:-10000}
      MODEL_CACHE_TTL_MS: ${MODEL_CACHE_TTL_MS:-60000}
      MODEL_REFRESH_TIMEOUT_MS: ${MODEL_REFRESH_TIMEOUT_MS:-15000}
      MODEL_REFRESH_COOLDOWN_MS: ${MODEL_REFRESH_COOLDOWN_MS:-5000}
      STARTUP_TIMEOUT_MS: ${STARTUP_TIMEOUT_MS:-20000}
      SERVER_IDLE_TIMEOUT_SECONDS: ${SERVER_IDLE_TIMEOUT_SECONDS:-30}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-16777216}
      MAX_CATALOG_BYTES: ${MAX_CATALOG_BYTES:-8388608}
      MAX_SSE_EVENT_BYTES: ${MAX_SSE_EVENT_BYTES:-1048576}
      MAX_TOOL_BUFFER_BYTES: ${MAX_TOOL_BUFFER_BYTES:-4194304}
      MAX_PARALLEL_TOOLS: ${MAX_PARALLEL_TOOLS:-128}
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
      COPILOT_INTEGRATION_ID: ${COPILOT_INTEGRATION_ID:-vscode-chat}
      COPILOT_INTENT: ${COPILOT_INTENT:-conversation-panel}
      COPILOT_INTERACTION_TYPE: ${COPILOT_INTERACTION_TYPE:-conversation-panel}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_LOGIN_URL: ${GITHUB_LOGIN_URL:-https://github.com}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-Iv1.b507a08c87ecfe98}
      GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-read:user}
      GITHUB_REQUEST_TIMEOUT_MS: ${GITHUB_REQUEST_TIMEOUT_MS:-15000}
      GITHUB_MAX_RETRIES: ${GITHUB_MAX_RETRIES:-2}
      GITHUB_MAX_RETRY_DELAY_MS: ${GITHUB_MAX_RETRY_DELAY_MS:-5000}
      TOKEN_REFRESH_COOLDOWN_MS: ${TOKEN_REFRESH_COOLDOWN_MS:-5000}
      TOKEN_REFRESH_SKEW_MS: ${TOKEN_REFRESH_SKEW_MS:-60000}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: ${CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY:-1}
      CLAUDE_CODE_GATEWAY_MODEL_DISCOVERY_TIMEOUT_MS: ${CLAUDE_CODE_GATEWAY_MODEL_DISCOVERY_TIMEOUT_MS:-15000}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}
      COPILOT_API_VERSION: ${COPILOT_API_VERSION:-2026-06-01}
      MODEL_ALIASES: ${MODEL_ALIASES:-}
      EDITOR_VERSION: ${EDITOR_VERSION:-1.115.0}
      PLUGIN_VERSION: ${PLUGIN_VERSION:-0.44.0}
      COPILOT_API_URL: ${COPILOT_API_URL:-}
      CLAUDE_PROJECT: ${CLAUDE_PROJECT:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      CLAUDE_FAST_MODEL: ${CLAUDE_FAST_MODEL:-}
      CLAUDE_OPUS_MODEL: ${CLAUDE_OPUS_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_FILE: ${GITHUB_TOKEN_FILE:-}
      XDG_DATA_HOME: ${XDG_DATA_HOME:-/data}
    volumes:
      - credentials:${XDG_DATA_HOME:-/data}
    restart: ${GATEWAY_RESTART_POLICY:-unless-stopped}
    stop_grace_period: ${GATEWAY_STOP_GRACE_PERIOD:-15s}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  credentials:
    name: ${GATEWAY_CREDENTIAL_VOLUME:-copilot-gateway-credentials}
