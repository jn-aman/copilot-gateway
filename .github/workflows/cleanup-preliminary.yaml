name: Remove preliminary container tag
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the superseded preliminary image version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api "/users/$PACKAGE_OWNER/packages/container/copilot-gateway/versions" --paginate \
            --jq '.[] | select(.metadata.container.tags | index("0.1.0")) | select((.metadata.container.tags | index("0.1.1")) == null) | .id' > /tmp/preliminary-versions
          while IFS= read -r version_id; do
            gh api --method DELETE "/users/$PACKAGE_OWNER/packages/container/copilot-gateway/versions/$version_id"
          done < /tmp/preliminary-versions
          gh api "/users/$PACKAGE_OWNER/packages/container/copilot-gateway/versions" --paginate \
            --jq '.[] | select(.metadata.container.tags | index("0.1.0")) | .id' > /tmp/remaining-versions
          test ! -s /tmp/remaining-versions
