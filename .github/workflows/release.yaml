name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yaml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Validate release version and image name
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          bun -e '
            const tag = process.env.RELEASE_TAG;
            const version = (await Bun.file("package.json").json()).version;
            if (tag !== "v" + version || !/^v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$/.test(tag)) throw new Error("Release tag must equal v + package.json version");
            await Bun.write(process.env.GITHUB_OUTPUT, "version=" + version + "\nimage=ghcr.io/" + process.env.RELEASE_REPOSITORY.toLowerCase() + "\n");
          '
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish multi-platform image with provenance and SBOM
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export runnable images for public release downloads
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" \
              --tag "$RELEASE_IMAGE:$RELEASE_VERSION-$arch" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --output "type=docker,dest=release-assets/copilot-gateway-$RELEASE_VERSION-$arch.tar" .
            gzip "release-assets/copilot-gateway-$RELEASE_VERSION-$arch.tar"
          done
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub release with images and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > release-assets/notes.md <<'EOF_NOTES'
          OpenAI and Anthropic compatible Copilot Gateway for Linux amd64 and arm64.

          ### Container

          ```sh
          docker pull ${RELEASE_IMAGE}:${RELEASE_VERSION}
          ```

          Follow the [setup guide](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/README.md) for headless device login and persistent storage. Available models depend on your Copilot account.

          To pin the immutable image:

          ```text
          ${RELEASE_IMAGE}@${RELEASE_DIGEST}
          ```

          The multi-platform image includes provenance and an SBOM.

          ### Downloadable images

          Download the archive for your architecture and `SHA256SUMS` from the assets below. These public downloads require no registry account.

          ```sh
          sha256sum --check SHA256SUMS --ignore-missing
          docker load --input copilot-gateway-${RELEASE_VERSION}-amd64.tar.gz
          ```

          For arm64, use `copilot-gateway-${RELEASE_VERSION}-arm64.tar.gz`. Imported image tags end with `-amd64` or `-arm64`.

          ### Validation

          Passed on Linux amd64 and arm64:

          - Strict types, lint, formatting, and protocol tests.
          - Compiled-container HTTP APIs, headless login persistence, and real MCP tool execution.
          - Retry handling and graceful shutdown.

          No GitHub credential is included in the images.
          EOF_NOTES
          bun -e '
            const path = "release-assets/notes.md";
            let notes = await Bun.file(path).text();
            for (const key of ["RELEASE_IMAGE", "RELEASE_VERSION", "RELEASE_DIGEST", "RELEASE_TAG", "GITHUB_REPOSITORY"]) {
              const value = process.env[key];
              if (!value) throw new Error("Missing release setting: " + key);
              notes = notes.replaceAll("${" + key + "}", value);
            }
            await Bun.write(path, notes);
          '
          release_options=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then release_options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/*.tar.gz release-assets/SHA256SUMS \
            --verify-tag --title "Copilot Gateway $RELEASE_TAG" --notes-file release-assets/notes.md "${release_options[@]}"
      - name: Check anonymous registry access
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          anonymous_config=$(mktemp -d)
          if DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$RELEASE_IMAGE@$RELEASE_DIGEST" >/dev/null; then
            echo "Public registry pull is available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::GHCR defaults new packages to private. Set the package visibility to Public once. Public release image archives are already available without login."
            echo "GHCR package visibility needs its one-time Public setting. Release archives remain anonymously downloadable." >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf "$anonymous_config"
